<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><title>Cerramos tu cuenta de TechServ</title></head>
<body style="font-family: sans-serif; font-size: 16px; line-height: 1.5;">
  <h1>Cerramos tu cuenta de TechServ</h1>
  <p>Hola, <span th:text="${nombre}">Nombre</span>.</p>
  <p>Tu cuenta se cerró correctamente.</p>
  <p>Si cambias de opinión, entra antes del <strong th:text="${fechaLimite}">Fecha límite</strong> (hora de Lima) y la recuperas.</p>
  <p>Después de esa fecha, tu cuenta se eliminará definitivamente.</p>
</body>
</html>
