<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><title>Eliminamos la cuenta de tu taller</title></head>
<body style="font-family: sans-serif; font-size: 16px; line-height: 1.5;">
  <h1>Eliminamos la cuenta de <span th:text="${razonSocial}">Tu taller</span></h1>
  <p>Hola, <span th:text="${nombre}">Nombre</span>.</p>

  <p>Sus técnicos ya no pueden entrar a TechServ.</p>

</html>
