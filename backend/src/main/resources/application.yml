spring:
  application:
    name: techserv

  # El .env de la raiz (el mismo que lee docker compose), si existe. Asi la
  # clave de Gemini se pone en un solo sitio y nunca en este archivo.
  config:
    import: optional:file:../.env[.properties]

  # MySQL no tiene un tipo con zona horaria: las fechas se guardan como
  # DATETIME en hora de Lima. connectionTimeZone + forceConnectionTimeZoneToSession
  # hacen que el driver, NOW() y CURRENT_DATE usen esa misma zona, y que Hibernate
  # (jdbc.time_zone, abajo) lea y escriba en ella.
  datasource:
    url: jdbc:mysql://localhost:33306/${MYSQL_DATABASE:techserv}?connectionTimeZone=America/Lima&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER:techserv}
    password: ${MYSQL_PASSWORD:techserv_local}

  jpa:
    hibernate:
      # El esquema lo manda Flyway. Hibernate no toca la estructura: solo valida
      # que las entidades y las tablas dicen lo mismo, y falla al arrancar si no.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Lima
        # Sin esto, en MySQL Hibernate guarda los OffsetDateTime en UTC y la
        # base acaba con dos relojes: el suyo y el de NOW()/DEFAULT, en Lima.
        timezone:
          default_storage: NORMALIZE

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

techserv:
  jwt:
    secreto: ${TECHSERV_JWT_SECRETO:clave-de-desarrollo-solo-local-cambiar-en-produccion-0123456789}
    horas: ${TECHSERV_JWT_HORAS:12}
  token-accion:
    horas: ${TECHSERV_TOKEN_ACCION_HORAS:72}
  url-publica: ${TECHSERV_URL_PUBLICA:http://localhost:8080}
  url-frontend: ${TECHSERV_URL_FRONTEND:http://localhost:5173}
  subidas:
    directorio: ${TECHSERV_SUBIDAS:../uploads}
  ia:
    clave: ${GEMINI_API_KEY:}
    modelo: ${TECHSERV_IA_MODELO:gemini-3.8-flash}
    # Si el principal esta saturado (503), se pasa a este.
    modelo-respaldo: ${TECHSERV_IA_MODELO_RESPALDO:gemini-3.5-flash}
    url-base: ${TECHSERV_IA_URL:https://generativelanguage.googleapis.com/v1beta}
    max-bytes-fotos: ${TECHSERV_IA_MAX_BYTES_FOTOS:14000000}

springdoc:
  swagger-ui:
    path: /api-docs

logging:
  level:
    pe.techserv: DEBUG
