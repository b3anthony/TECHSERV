# Servicios de apoyo del prototipo. Ni uno solo sale de esta máquina.
services:
  db:
    image: postgres:16-alpine
    container_name: techserv-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techserv}
      POSTGRES_USER: ${POSTGRES_USER:-techserv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techserv_local}
    ports:
      - "55432:5432"   # 55432 y no 5432, para no chocar con un PostgreSQL ya instalado en la máquina
    volumes:
      - techserv_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techserv} -d ${POSTGRES_DB:-techserv}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Bandeja de correo de mentira: recibe todo y no reenvía nada.
  # Interfaz web en http://localhost:8025
  correo:
    image: axllent/mailpit:latest
    container_name: techserv-correo
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  techserv_db:
